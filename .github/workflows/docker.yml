name: Image Docker

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sillage
          POSTGRES_PASSWORD: sillage
          POSTGRES_DB: sillage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sillage" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Nom et version de l'image
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          echo "image=ghcr.io/${owner}/sillage" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (dont l'API sur une vraie base PostgreSQL)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://sillage:sillage@localhost:5432/sillage_test
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests

      # Jamais de tag « latest » : Hangar déploie une version explicite.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
